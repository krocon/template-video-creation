<!DOCTYPE html>
<html lang="de" data-composition-variables='[
  {"id":"lang","type":"string","label":"Sprache (de | en)","default":"de"},
  {"id":"format","type":"string","label":"Format (9x16 | 16x9)","default":"9x16"}
]'>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angular 22 Signal Forms – 1-Minute-Lernvideo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
  <!--
    HyperFrames-Komposition. Sprache & Format kommen als Variablen:
      npx hyperframes render --variables '{"lang":"en","format":"16x9"}'
    Im Browser-Preview alternativ per URL: index.html?lang=en&format=16x9
    Maße & Dauer hier gelten für die Vorschau (DE 9:16). Beim Rendern erzeugt scripts/render_pipeline.js
    je Variante eine Kopie mit festen Werten (HyperFrames liest sie statisch, vor jedem Skript).
  -->
  <div id="composition"
       data-composition-id="one-minute-lesson"
       data-width="1080"
       data-height="1920"
       data-duration="65"
       data-format="9x16">

    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <!-- Voiceover nur für die Studio-Vorschau; das finale Video bekommt den Ton per scripts/mux_video.py.
         src = DE-Spur, die Timeline tauscht bei lang=en auf die EN-Spur. -->
    <audio id="voiceover" class="clip" src="assets/audio/angular_signal_forms_vo_de_fast.mp3" data-start="0" data-duration="65" data-volume="1"></audio>

    <div id="header-slot"></div>

    <!-- 1 · Hook -->
    <section class="scene" id="scene-hook">
      <div class="hook-greet" id="hook-greet"></div>
      <div class="hook-question" id="hook-question"></div>
      <div id="hook-slot"></div>
    </section>

    <!-- 2a · Kontext: Versionen -->
    <section class="scene" id="scene-versions">
      <h1 class="mega-title grad" id="versions-title"></h1>
      <p class="scene-subtitle" id="versions-subtitle"></p>
      <div id="versions-slot"></div>
    </section>

    <!-- 2b · Problem: Reactive Forms -->
    <section class="scene" id="scene-reactive">
      <h2 class="scene-title" id="reactive-title"></h2>
      <div id="reactive-slot"></div>
    </section>

    <!-- 3 · Kernpunkte -->
    <section class="scene" id="scene-points">
      <div id="points-slot"></div>
    </section>

    <!-- 4 · Handlung -->
    <section class="scene" id="scene-action">
      <h2 class="scene-title" id="action-title"></h2>
      <div id="action-slot"></div>
    </section>

    <!-- 5 · Outro -->
    <section class="scene" id="scene-outro">
      <div id="outro-slot"></div>
    </section>
  </div>

  <script src="./src/vendor/gsap.min.js"></script>
  <script src="./src/cues.js"></script>
  <script src="./src/content.js"></script>
  <script src="./src/components/code-editor.js"></script>
  <script src="./src/components/header-badge.js"></script>
  <script src="./src/components/mock-form.js"></script>
  <script src="./src/components/version-track.js"></script>
  <script src="./src/components/reactive-problem.js"></script>
  <script src="./src/components/checklist-card.js"></script>
  <script src="./src/components/action-banner.js"></script>
  <script src="./src/components/outro-cta.js"></script>
  <script src="./src/timeline.js"></script>
  <script>
    // Genau EINE pausierte Master-Timeline (Aufbau in src/timeline.js)
    window.__timelines = window.__timelines || {};
    window.__timelines["one-minute-lesson"] = window.__buildLessonTimeline();
  </script>
</body>
</html>
